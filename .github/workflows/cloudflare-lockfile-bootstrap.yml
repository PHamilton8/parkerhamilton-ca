name: cloudflare-lockfile-bootstrap

on:
  push:
    branches: ['prep/cloudflare-workers-release-infra-v1']
    paths:
      - '.github/workflows/cloudflare-lockfile-bootstrap.yml'
      - 'package.json'

permissions:
  contents: write

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prep/cloudflare-workers-release-infra-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit the deterministic lockfile if Wrangler changed it
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock pinned Wrangler release dependency'
          git push origin HEAD:prep/cloudflare-workers-release-infra-v1
