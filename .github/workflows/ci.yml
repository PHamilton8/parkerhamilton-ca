name: ci

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'integration/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run public-safety
      - run: npm run qa:contrast
      - run: npm audit --audit-level=high
      - name: Record successful source provenance
        if: success()
        run: node scripts/ci-release-evidence.mjs write-provenance
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ci-provenance-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .ci-provenance/ci-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copy-locked-visual-review-baseline-${{ github.sha }}
          path: |
            artifacts/baseline/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Record successful source provenance
        if: success()
        run: node scripts/ci-release-evidence.mjs write-provenance
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ci-provenance-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .ci-provenance/ci-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
