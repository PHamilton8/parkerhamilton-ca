name: Create Review Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character source SHA to review'
        required: true
        type: string
      confirm:
        description: 'Type exactly: CREATE REVIEW CANDIDATE'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: parker-review-candidate
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
  EXPECTED_WORKERS_SUBDOMAIN: ${{ vars.EXPECTED_WORKERS_SUBDOMAIN }}
  EXPECTED_CLOUDFLARE_ACCOUNT_ID: ${{ vars.EXPECTED_CLOUDFLARE_ACCOUNT_ID }}

jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'CREATE REVIEW CANDIDATE'
    environment: preview
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Exact 40-character SHA required"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Freeze exact source
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1)"

      - run: npm ci

      - name: Require green CI for this exact SHA
        id: ci
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .release-candidate
          bash scripts/release-node.sh scripts/postlaunch-release.mjs verify-ci "$CANDIDATE_SHA" > .release-candidate/ci.json
          echo "run_id=$(node -e "const j=require('./.release-candidate/ci.json');process.stdout.write(String(j.workflowRunId))")" >> "$GITHUB_OUTPUT"

      - name: Release build and public-safety validation
        run: npm run release:build

      - name: Fresh complete clean audit before credentialed candidate upload
        run: bash scripts/release-node.sh scripts/clean-release-risk.mjs run dist

      - name: Cloudflare infrastructure validation
        run: npm run infra:validate

      - name: Recheck tracked source after build
        run: git diff --exit-code HEAD

      - name: Freeze tree and dist identity
        id: identity
        shell: bash
        run: |
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          bash scripts/release-node.sh scripts/postlaunch-release.mjs dist-hash dist > .release-candidate/dist.json
          DIST_SHA="$(node -e "const j=require('./.release-candidate/dist.json');process.stdout.write(j.sha256)")"
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"
          echo "dist_sha=$DIST_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate release runtime and reviewed destination policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/release-node.sh scripts/postlaunch-release.mjs release-environment > .release-candidate/environment-policy.json

      - name: Recheck selected CI immediately before upload
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/release-node.sh scripts/postlaunch-release.mjs verify-ci "$CANDIDATE_SHA" > .release-candidate/ci-rechecked.json
          node -e "const a=require('./.release-candidate/ci.json');const b=require('./.release-candidate/ci-rechecked.json');require('node:assert/strict').deepEqual(b,a)"

      - name: Snapshot production before candidate upload
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          bash scripts/release-node.sh scripts/postlaunch-release.mjs cf-snapshot > .release-candidate/production-before.json
          bash scripts/release-node.sh scripts/postlaunch-release.mjs cf-version-inventory > .release-candidate/versions-before.json

      - name: Upload exactly one unpublished Worker Version
        id: upload_command
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-version-upload.ndjson
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          bash scripts/release-node.sh scripts/postlaunch-release.mjs assert-risk-artifact dist > /dev/null
          set +e
          bash scripts/release-node.sh --wrangler versions upload --message "ParkerHamilton review candidate $CANDIDATE_SHA" > "${{ runner.temp }}/wrangler-upload.log" 2>&1
          result=$?
          printf '{"exitCode":%d,"rawLogRetainedInRunnerOnly":true}\n' "$result" > .release-candidate/upload-attempt.json
          exit "$result"

      - name: Resolve immutable Version ID and preview URL
        id: upload
        shell: bash
        run: |
          bash scripts/release-node.sh scripts/postlaunch-release.mjs parse-upload-output "${{ runner.temp }}/wrangler-version-upload.ndjson" > .release-candidate/upload.json
          echo "version_id=$(node -e "const j=require('./.release-candidate/upload.json');process.stdout.write(j.versionId)")" >> "$GITHUB_OUTPUT"
          echo "preview_url=$(node -e "const j=require('./.release-candidate/upload.json');process.stdout.write(j.previewUrl)")" >> "$GITHUB_OUTPUT"

      - name: Prove private preview boundary and authenticated smoke
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: bash scripts/release-node.sh scripts/postlaunch-release.mjs preview-smoke "$PREVIEW_URL" "$VERSION_ID" > .release-candidate/preview-smoke.json

      - name: Always collect sanitized provider after-state
        id: after
        if: ${{ always() && steps.before.outcome == 'success' && steps.upload_command.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPLOAD_OUTCOME: ${{ steps.upload_command.outcome }}
        shell: bash
        run: |
          if ! bash scripts/release-node.sh scripts/postlaunch-release.mjs collect-after-state .release-candidate "${{ runner.temp }}/wrangler-version-upload.ndjson" "$UPLOAD_OUTCOME"; then
            test -s .release-candidate/operation-evidence.json || printf '{"status":"NON_PROMOTABLE_OPERATION_EVIDENCE","reconciliationRequired":true,"afterState":"unavailable"}\n' > .release-candidate/operation-evidence.json
            exit 1
          fi
          bash scripts/release-node.sh scripts/postlaunch-release.mjs assert-production-unchanged .release-candidate/production-before.json .release-candidate/production-after.json > .release-candidate/production-unchanged.json

      - name: Write immutable candidate manifest
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TREE_SHA: ${{ steps.identity.outputs.tree_sha }}
          DIST_SHA: ${{ steps.identity.outputs.dist_sha }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        shell: bash
        run: |
          bash scripts/release-node.sh scripts/postlaunch-release.mjs make-candidate-manifest             "$CANDIDATE_SHA" "$TREE_SHA" "$DIST_SHA" "$VERSION_ID" "$PREVIEW_URL" "$CI_RUN_ID"             .release-candidate/production-before.json .release-candidate/production-after.json             > .release-candidate/candidate.json

      - name: Preserve candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: review-candidate-${{ steps.identity.outputs.tree_sha }}
          path: |
            .release-candidate/ci.json
            .release-candidate/ci-rechecked.json
            .release-candidate/dist.json
            .release-candidate/environment-policy.json
            .release-candidate/production-before.json
            .release-candidate/versions-before.json
            .release-candidate/upload-attempt.json
            .release-candidate/upload.json
            .release-candidate/preview-smoke.json
            .release-candidate/operation-evidence.json
            .release-candidate/production-after.json
            .release-candidate/production-unchanged.json
            .release-candidate/candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Preserve non-promotable failure evidence
        if: ${{ always() && !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-review-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-candidate/ci.json
            .release-candidate/ci-rechecked.json
            .release-candidate/dist.json
            .release-candidate/environment-policy.json
            .release-candidate/production-before.json
            .release-candidate/versions-before.json
            .release-candidate/upload-attempt.json
            .release-candidate/upload.json
            .release-candidate/preview-smoke.json
            .release-candidate/operation-evidence.json
            .release-candidate/production-after.json
            .release-candidate/production-unchanged.json
            .release-candidate/candidate.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve complete candidate clean-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-clean-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-audit/audit.json
            .release-audit/audit.stderr.log
            .release-audit/audit-run.json
            .release-audit/risk-evaluation.json
            .release-audit/clean-policy.json
            .release-audit/context.json
            .release-audit/artifact.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
