name: cloudflare-private-final-rc-preview

on:
  workflow_dispatch:
    inputs:
      rc_ref:
        description: 'Exact final RC SHA/ref'
        required: true
        type: string
      confirm:
        description: 'Type exactly: CREATE_PRIVATE_FINAL_RC_PREVIEW'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-private-final-rc-preview
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicit authorization
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = 'CREATE_PRIVATE_FINAL_RC_PREVIEW'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Create authenticated immutable final-RC preview
        run: node scripts/final-rc-preview.mjs preview --rc "${{ inputs.rc_ref }}" --authorize CREATE_PRIVATE_FINAL_RC_PREVIEW
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_REVIEW_EMAIL: ${{ vars.PREVIEW_REVIEW_EMAIL }}
      - name: Upload fail-closed release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-final-rc-preview-evidence
          path: .release-preview/
          include-hidden-files: true
          if-no-files-found: warn
