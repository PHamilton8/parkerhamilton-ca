name: cloudflare-private-final-rc-preview

on:
  workflow_dispatch:
    inputs:
      rc_ref:
        description: 'Exact certified final RC SHA/ref'
        required: true
        type: string
      confirm:
        description: 'Type exactly: CREATE_PRIVATE_FINAL_RC_PREVIEW'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-private-final-rc-preview
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  preview:
    if: github.ref == 'refs/heads/prep/final-release-tooling-v3-reviewed-replacement' || github.ref == 'refs/heads/integration/final-rc-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicit authorization
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = 'CREATE_PRIVATE_FINAL_RC_PREVIEW'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Install media and browser validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify reviewed readable tooling
        run: node scripts/final-rc-preview.mjs --verify-only
      - name: Create authenticated immutable final-RC preview
        run: node scripts/final-rc-preview.mjs preview --rc "$RC_REF" --authorize CREATE_PRIVATE_FINAL_RC_PREVIEW
        env:
          RC_REF: ${{ inputs.rc_ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_REVIEW_EMAIL: ${{ vars.PREVIEW_REVIEW_EMAIL }}
      - name: Upload fail-closed release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-final-rc-preview-evidence-${{ github.sha }}
          path: .release-preview/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
