name: gate0-recovery-targeted-webkit

on:
  push:
    branches: ['chore/gate0-ci-authority-recovery']
    paths:
      - 'src/styles/compound-growth.css'
      - 'tests/browser/authority-global.spec.ts'
      - '.github/workflows/gate0-recovery-targeted-webkit.yml'

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  compound-overflow-webkit-1440:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/browser/authority-global.spec.ts --project=webkit --grep "all portfolio routes have no page-level horizontal overflow at 1440px"
