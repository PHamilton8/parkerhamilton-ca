name: cloudflare-production-release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: DEPLOY parkerhamilton.ca'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-release
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY parkerhamilton.ca'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run release:build
      - run: npm run infra:validate
      - name: Deploy the reviewed main commit to the Parker Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
