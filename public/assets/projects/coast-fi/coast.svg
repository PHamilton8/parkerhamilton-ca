<text x="64" y="309" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#56615B">NOW</text><text x="586" y="309" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#56615B">RETIREMENT</text>
</svg>