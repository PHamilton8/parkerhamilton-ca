<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-labelledby="t d">
<title id="t">Weekly grocery planning automation</title><desc id="d">A four stage pipeline from flyer data to structured deals, planning rules, and an Excel-ready weekly menu and grocery list.</desc>
<rect width="700" height="360" rx="28" fill="#EAF5F3"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#112124">
 <text x="42" y="52" font-size="20" font-weight="700">WEEKLY PLANNING PIPELINE</text>
 <text x="42" y="78" font-size="13" fill="#506064">Live sale data → rules → usable output</text>
</g>
<g stroke="#0A7774" stroke-width="2" fill="#F9FBFA">
 <rect x="42" y="124" width="130" height="112" rx="16"/><rect x="205" y="124" width="130" height="112" rx="16"/><rect x="368" y="124" width="130" height="112" rx="16"/><rect x="531" y="124" width="130" height="112" rx="16"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" fill="#112124" text-anchor="middle">
 <text x="107" y="162" font-size="14" font-weight="700">FLYER DATA</text><text x="107" y="188" font-size="12">items + prices</text><text x="107" y="210" font-size="12">by store</text>
 <text x="270" y="162" font-size="14" font-weight="700">STRUCTURE</text><text x="270" y="188" font-size="12">clean + group</text><text x="270" y="210" font-size="12">candidate deals</text>
 <text x="433" y="162" font-size="14" font-weight="700">HOUSE RULES</text><text x="433" y="188" font-size="12">preferences</text><text x="433" y="210" font-size="12">exclusions + pantry</text>
 <text x="596" y="162" font-size="14" font-weight="700">OUTPUT</text><text x="596" y="188" font-size="12">menu + list</text><text x="596" y="210" font-size="12">Excel-ready</text>
</g>
<g stroke="#0A7774" stroke-width="2" fill="none" stroke-linecap="round"><path d="M177 180h20"/><path d="M340 180h20"/><path d="M503 180h20"/></g>
<g fill="#0A7774"><path d="M197 180l-8-5v10z"/><path d="M360 180l-8-5v10z"/><path d="M523 180l-8-5v10z"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#506064" font-size="12"><text x="42" y="292">Human review stays in the loop before purchasing.</text></g>
</svg>